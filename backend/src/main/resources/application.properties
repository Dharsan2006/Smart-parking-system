# Server
server.port=${PORT:8081}

# Database (PostgreSQL / Neon Cloud)
spring.datasource.url=jdbc:postgresql://ep-tiny-violet-b3fx31ri-pooler.c-4.ap-southeast-1.aws.neon.tech/Smartparking?sslmode=require
spring.datasource.username=Smartparking_owner
spring.datasource.password=npg_5OCUwQlZz1Bu
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Connection Pool (Optimized for Neon Serverless PostgreSQL)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:SmartParkingSecretKey2024VeryLongSecretKeyForJWTTokenGeneration}
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Jackson - serialize LocalDateTime as ISO-8601 strings, not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Pricing
app.pricing.base-rate=2.0
app.pricing.hourly-rate=5.0

